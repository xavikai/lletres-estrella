<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1024">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lletres Estrella">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lletres Estrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Lexend:wght@400;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one central stage column (max 860px) for tablet, sticky stat bar on top, tab bar at the bottom.
   Look: night-stage goth-kawaii, deliberately single dark theme. */
:root{
  --bg:#1a1024; --bg2:#231533; --card:#2e1c43; --card2:#3a2556; --line:#4d3569;
  --fg:#f7f0fd; --muted:#c3b1d8; --ink:#1a1024;
  --lila:#c9a7ff; --rosa:#ff74b8; --menta:#7ff0c9; --groc:#ffd66b; --coral:#ff9a8a;
  --display:"Grandstander","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --tile:"Lexend","Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, #ffffff55 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 9%, #ffffff44 50%, transparent 51%),
    radial-gradient(2px 2px at 64% 42%, #c9a7ff55 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 30% 70%, #ffffff33 50%, transparent 51%),
    radial-gradient(2px 2px at 90% 80%, #ff74b844 50%, transparent 51%),
    radial-gradient(ellipse at 50% -10%, #3b1f58 0%, var(--bg) 60%);
  background-color:var(--bg);
  background-attachment:fixed;
  color:var(--fg); font-family:var(--body); font-size:18px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--menta);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding-block:10px 14px}
.top .row{max-width:860px;margin:0 auto;padding-inline:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.3px;margin-right:auto;color:var(--lila)}
.brand b{color:var(--rosa)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#140c1ccc;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .row{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--rosa)}

h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:18px;font-weight:800;font-size:19px;background:var(--rosa);color:var(--ink);box-shadow:0 4px 0 #b3407d;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b3407d}
.btn.alt{background:var(--card2);color:var(--fg);box-shadow:0 4px 0 #1f1230;border:1px solid var(--line)}
.btn.menta{background:var(--menta);box-shadow:0 4px 0 #3fa585}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:24px;height:24px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.mascot{width:100%;max-width:220px;aspect-ratio:1}
.mascot svg{width:100%;height:100%;display:block}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.jump{animation:jump .6s ease}
@keyframes jump{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.bubble{background:var(--fg);color:var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;display:inline-block;position:relative}
.lvl{height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),var(--rosa));border-radius:99px}
.mission{background:linear-gradient(135deg,#4a2470,#2e1c43 70%);border:1px solid #7a4bb0}
.dots{display:flex;gap:8px}
.dots span{width:40px;height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.dots span.on{background:var(--menta);border-color:var(--menta)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
@media (max-width:480px){.games{grid-template-columns:1fr}}
.game{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.game:active{background:var(--card2)}
.game .t{font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px}
.game .t svg{width:28px;height:28px;flex:none}
.game .d{color:var(--muted);font-size:16px}

/* game screen */
.gbar{display:flex;align-items:center;gap:12px}
.gbar .x{width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.gbar .x svg{width:22px;height:22px}
.prog{flex:1;display:flex;gap:6px}
.prog span{flex:1;height:10px;border-radius:99px;background:var(--card2)}
.prog span.done{background:var(--menta)}
.prog span.cur{background:var(--lila)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 18px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.speak{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot,.tile{font-family:var(--tile);font-weight:600;font-size:30px;min-width:56px;height:64px;padding:0 10px;border-radius:14px;display:grid;place-items:center}
.slot{border:2px dashed var(--line);background:var(--bg2)}
.slot.full{border-style:solid;border-color:var(--lila);background:var(--card2)}
.slot.ok{border-color:var(--menta);background:#1f4a3f}
.slot.bad{border-color:var(--rosa);background:#5a1f3f}
.tile{background:var(--fg);color:var(--ink);box-shadow:0 4px 0 #9a86b5}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #9a86b5}
.tile.used{visibility:hidden}
.word{font-family:var(--tile);font-size:44px;font-weight:600;letter-spacing:1px;overflow-wrap:anywhere}
.sentence .tw{font-size:40px;white-space:nowrap}
.word.big{font-size:56px;color:var(--fg)}
.ctx{font-size:24px;color:var(--muted);max-width:640px}
.ctx .hl{color:var(--menta)}
.blank{display:inline-block;width:4.5em;height:.9em;border-bottom:4px dotted var(--lila);vertical-align:baseline}
.word .gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--rosa);color:var(--rosa)}
.word .hl,.fam .hl{color:var(--menta);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--tile);font-size:32px;font-weight:600;min-width:96px;height:80px;border-radius:20px;background:var(--fg);color:var(--ink);box-shadow:0 5px 0 #9a86b5;padding:0 18px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #9a86b5}
.opt.bad{background:var(--coral);opacity:.6}
.opt.ok{background:var(--menta)}
.sentence{font-family:var(--tile);font-size:28px;line-height:1.6}
.fam{background:var(--bg2);border:1px dashed var(--lila);border-radius:16px;padding:12px 16px;font-size:18px}
.fam b{font-family:var(--tile);font-size:28px}
.feedback{border-radius:18px;padding:12px 16px;font-weight:700;max-width:620px}
.feedback.ok{background:#1f4a3f;border:1px solid var(--menta)}
.feedback.try{background:#4a2a14;border:1px solid var(--groc)}
.feedback.no{background:#3d1d45;border:1px solid var(--lila)}
.rulecard{background:linear-gradient(135deg,#ff74b8,#c9a7ff);color:var(--ink);border-radius:22px;padding:18px;text-align:left;max-width:560px}
.rulecard h3{font-size:24px}
.cutline{display:flex;flex-wrap:wrap;justify-content:center;row-gap:10px;font-family:var(--tile);font-size:30px;font-weight:600;overflow-wrap:anywhere}
.cutline .ch{padding:0 1px}
.cutline .cut{width:22px;height:52px;border-radius:8px;position:relative}
.cutline .cut::after{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:#ffffff18;border-radius:2px}
.cutline .cut.on::after{background:var(--rosa);width:4px;left:9px;top:0;bottom:0}
.cutline .cut.miss::after{background:var(--menta);width:4px;left:9px;top:0;bottom:0}
.cutline .cut.extra::after{background:var(--coral);width:4px;left:9px;opacity:.5}
.summary .big{font-family:var(--display);font-size:40px;font-weight:800;color:var(--groc)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pc{border-radius:18px;aspect-ratio:3/4.2;max-width:100%;padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border:2px solid #ffffff30}
.pc .nm{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink);background:#ffffffcc;border-radius:10px;padding:4px 8px;align-self:flex-start}
.pc .mini{width:100%;aspect-ratio:1}
.pc.locked{background:var(--bg2)!important;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:40px}
.pc.rare::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.rule-pc{border-radius:18px;padding:14px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rule-pc.on{background:linear-gradient(135deg,#7ff0c9,#c9a7ff);color:var(--ink);border-color:transparent}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item.wear{border-color:var(--menta)}
input[type=text]{font:inherit;font-size:19px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:12px 14px;min-height:52px;width:100%}

/* parents */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.bar .track{grid-column:1/-1;height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px}
td.w{font-family:var(--tile);font-size:19px}
.boxes{display:flex;gap:3px}
.boxes i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--menta)}
.small{font-size:15px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:end}
@media (max-width:640px){.form{grid-template-columns:1fr}}
label{font-weight:700;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sync{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--menta)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--fg);color:var(--ink);font-weight:800;border-radius:16px;padding:12px 18px;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px #0008}
.arena{display:block;margin:0 auto;border-radius:22px;border:1px solid var(--line);touch-action:none;max-width:100%}
.cq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.cq .sentence{font-size:24px}.cq .gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--rosa)}
.cqmsg{color:var(--groc)}
.slot.syl,.tile.syl{font-size:26px;min-width:72px}
.puntsline{font-family:var(--tile);font-size:24px;line-height:2.2;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;max-width:680px}
.puntsline .pw{padding:0 2px}
.puntsline .dot{width:26px;height:40px;border-radius:8px;font-size:34px;font-weight:800;line-height:1;color:var(--rosa);position:relative}
.puntsline .dot::after{content:"";position:absolute;left:12px;bottom:6px;width:3px;height:3px;border-radius:50%;background:#ffffff40}
.puntsline .dot.on::after,.puntsline .dot.extra::after{display:none}
.puntsline .dot.miss{background:#1f4a3f}.puntsline .dot.extra{color:var(--coral);opacity:.6}
.karaoke{display:flex;flex-direction:column;gap:10px;max-width:680px}
.kline{font-family:var(--tile);font-size:28px;line-height:1.5;margin:0}
.kw{border-radius:10px;padding:0 4px;transition:background .15s,color .15s}
.kw.on{background:var(--rosa);color:var(--ink);position:relative}
.kw.on::before{content:"";position:absolute;left:50%;top:-12px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--groc)}
.kw.past{color:var(--menta)}
.tl{color:var(--rosa);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.sticker{position:relative;display:inline-block;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#e9dcff);box-shadow:0 0 0 3px #fff,0 4px 14px #0006;flex:none}
.sticker .e1{position:absolute;left:6px;top:4px;font-size:38px;line-height:1}
.sticker .e2{position:absolute;right:0;bottom:0;font-size:28px;line-height:1;transform:rotate(12deg)}
.sticker.big{width:120px;height:120px}.sticker.big .e1{font-size:72px;left:10px;top:8px}.sticker.big .e2{font-size:52px;right:2px;bottom:2px}
.sticker.ghost{display:grid;place-items:center;font-size:30px;color:var(--ink);opacity:.5}
.ghostc{color:var(--ink);opacity:.4;font-family:var(--display)}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.dcard.empty{border-style:dashed}
.dcard .dw{font-family:var(--tile);font-size:24px;overflow-wrap:anywhere}
.slot.paint{background:var(--rosa);color:var(--ink);border-color:var(--rosa)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;width:100%;max-width:620px}
.em{font-size:32px;height:56px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.em:active{background:var(--card2)}
.dance{animation:dance 1s ease-in-out infinite}
@keyframes dance{25%{transform:rotate(-8deg) translateY(-8px)}75%{transform:rotate(8deg) translateY(-8px)}}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mat{display:grid;gap:8px;max-width:340px;width:100%}
.cell{display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:72px;height:72px}
.mat .cell{width:auto;height:auto;aspect-ratio:1}
.cell.q{border:2px dashed var(--rosa)}
.shp{width:80%;height:80%}
.qm{font-family:var(--display);font-size:34px;color:var(--rosa)}
.opt.lopt{width:92px;height:92px;min-width:0;padding:8px;display:grid;place-items:center;font-family:var(--display);font-size:36px}
.opt.lopt .shp{width:100%;height:100%}
.bal{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:center;gap:8px;width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.bal.q{border:2px dashed var(--rosa)}
.pan{min-height:56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:30px;line-height:1.1;background:var(--card2);border-radius:14px;padding:6px;letter-spacing:2px}
.beam{display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--groc)}
@media (prefers-reduced-motion:reduce){.dance{animation:none}}
@media (prefers-reduced-motion:reduce){.bob,.jump,.pc.rare::after{animation:none}}
</style>
</head>
<body>


<header class="top"><div class="row">
  <div class="brand">Lletres <b>Estrella</b></div>
  <span class="chip" id="chipLvl"></span>
  <span class="chip" id="chipStars"></span>
  <span class="chip" id="chipStreak"></span>
</div></header>

<main class="wrap" id="view"></main>

<nav class="nav" id="nav"><div class="row">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Casa</button>
  <button data-go="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-3"/><path d="M9 8h6" stroke-linecap="round"/></svg>Diccionari</button>
  <button data-go="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6" y="3" width="13" height="17" rx="2.5" transform="rotate(8 12 12)"/><rect x="4" y="4" width="13" height="17" rx="2.5"/></svg>Cartes</button>
  <button data-go="closet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Vestidor</button>
  <button data-go="parents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.5 20c.6-3.5 2.8-5.5 5.5-5.5s4.9 2 5.5 5.5M14 15.3c2.7-.6 5.8.7 6.8 4.7"/></svg>Pares</button>
</div></nav>

<div class="toast" id="toast" hidden></div>

<script>
/* ============ DATA ============ */
const ECO_BANK = [
  ['notaven','Imperfet en -ava: sempre v.','Es notaven una mica cansats.'],
  ['comunicaven','Imperfet en -ava: sempre v.','Es comunicaven amb xisclets.'],
  ['cantaven','Imperfet en -ava: sempre v.','Els ocells cantaven tot el matí.'],
  ['valgut','Família: val.','Ha valgut la pena esperar.'],
  ['avis','Família: avi, àvia. Amb v.','Els meus avis viuen a prop.'],

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let saveT=null,pushing=false,again=false;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT); saveT=setTimeout(pushRemote,1200);
}
async function pushRemote(){
  if(!DOC) return;
  if(pushing){again=true;return}
  pushing=true;
  try{await DOC.set(JSON.parse(JSON.stringify(S))); setSync('cloud')}
  catch(e){ setSync('local'); if(e&&e.code==='invalid_argument') DOC=null; }
  pushing=false;
  if(again){again=false;pushRemote()}
}
function setSync(m){syncMode=m; const el=document.getElementById('syncline'); if(el) el.outerHTML=syncHTML();}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use('db'); if(!db) return;
    DOC=db.doc('app/estat');
    DOC.onSnapshot(snap=>{
      if(!snap.exists){ if(S.updated) pushRemote(); setSync('cloud'); return; }
      if(snap.metadata.hasPendingWrites) return;
      const d=JSON.parse(JSON.stringify(snap.data()));
      if((d.updated||0)>(S.updated||0)){
        S=Object.assign(DEF(),d);
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(!G) render();
      } else if((S.updated||0)>(d.updated||0)) pushRemote();
      setSync('cloud');
    },()=>setSync('local'));
  }catch(e){}
})();

const XP_LVL=120;
const level=()=>1+Math.floor(S.xp/XP_LVL);
const stage=()=>{const l=level();return l<3?1:l<6?2:3};
const rank=()=>{const l=level();return l<3?'Trainee':l<6?'Rookie':l<10?'Idol':'Llegenda'};
function streakNow(){ if(!S.lastDay) return 0; const g=dayDiff(S.lastDay,TODAY()); return (g<=1||(g===2&&S.jokers>0))?S.streak:0; }
function touchStreak(){
  const t=TODAY(); if(S.lastDay===t) return;
  if(!S.lastDay) S.streak=1;
  else{const g=dayDiff(S.lastDay,t);
    if(g===1) S.streak++;
    else if(g===2&&S.jokers>0){S.jokers--;S.streak++;toast('Has fet servir un comodí: la ratxa continua!')}
    else S.streak=1;}
  if(S.streak%7===0&&S.jokers<2){S.jokers++;toast('Set dies seguits! Guanyes un comodí de ratxa.')}
  S.lastDay=t;
}
function stat(cat,ok){const s=S.stats[cat]||(S.stats[cat]={ok:0,n:0,recent:[]});s.n++;if(ok)s.ok++;s.recent=(s.recent||[]).concat(ok?1:0).slice(-20);}
const BOX_DAYS=[0,1,2,4,7,14];
function llAdd(w,pista,cat){
  w=w.toLowerCase().trim(); if(!w) return false;
  const e=S.llibreta.find(x=>x.w===w);
  if(e){e.box=1;e.due=TODAY();return false}
  S.llibreta.push({w,pista:pista||'',cat:cat||'',box:1,due:TODAY(),added:TODAY()}); return true;
}
function llResult(w,ok){
  const e=S.llibreta.find(x=>x.w===w); if(!e) return;
  e.box=ok?Math.min(5,e.box+1):1; e.due=addDays(TODAY(),BOX_DAYS[e.box]);
}

let AC=null;
function beep(ok){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880,1320]:[330,262];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,AC.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*.09+.02);
      g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.09+.22);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.09);o.stop(AC.currentTime+i*.09+.25)});
  }catch(e){}
}
let caVoice=null, voicesChecked=false;

}

/* ============ GAME ENGINE ============ */
function startGame(kind,n,mission){
  if(needBreak()){pendingStart=[kind,n,mission];G=null;view='break';render();return}
  const label=kind;
  let items;
  if(kind==='alien'){if(!caVoice){toast('Aquest joc necessita la veu catalana de la tauleta. Mira la Zona de pares.');return}items=alienItems(n);kind='eco'}
  else if(kind==='logic'){items=logicItems(n)}
  else if(kind==='mira'){items=buildItems('eco',n).map(x=>({...x,mode:'vis'}));kind='eco'}
  else if(kind==='eco'){items=buildItems('eco',n).map((x,i)=>mission&&i%2?{...x,mode:'vis'}:x);if(mission&&caVoice)items[items.length-1]=alienItems(1)[0]}
  else items=buildItems(kind,n);
  G={kind,label,items,i:0,mission:!!mission,tries:0,done:false,earned:{stars:0,xp:0},newWords:[],results:[],st:{}};
  if(kind==='truc'){G.rule=items[0].rule;G.showRule=true}
  if(kind==='cursa')G.total=n;
  render();
}
function buildItems(kind,n){
  if(kind==='eco'){
    const t=TODAY();
    const frase=w=>{const b=ECO_BANK.find(x=>x[0]===w);return b?b[2]:''};
    const due=shuffle(S.llibreta.filter(e=>e.due<=t)).slice(0,Math.ceil(n*.75)).map(e=>({w:e.w,pista:e.pista,f:e.frase||frase(e.w),ll:true}));
    const used=new Set(due.map(d=>d.w));
    const rest=shuffle(ECO_BANK.filter(b=>!used.has(b[0]))).slice(0,n-due.length).map(b=>({w:b[0],pista:b[1],f:b[2]}));
    return shuffle(due.concat(rest));
  }
  if(kind==='det') return shuffle(DET_BANK).slice(0,n);
  if(kind==='truc'){
    // weakest rule first: lowest recent accuracy, untried rules count as weakest
    const acc=k=>{const s=S.stats[k];if(!s||!s.recent||!s.recent.length) return -1;return s.recent.reduce((a,b)=>a+b,0)/s.recent.length};
    const keys=shuffle(Object.keys(RULES)).sort((a,b)=>acc(a)-acc(b));
    const k=keys[0], R=RULES[k];
    const main=shuffle(R.items.filter(x=>!x[2])).slice(0,n-1), contrast=shuffle(R.items.filter(x=>x[2])).slice(0,1);
    return shuffle(main.concat(contrast)).map(x=>({rule:k,s:x[0],a:x[1],why:x[2]||''}));
  }
  if(kind==='talla') return shuffle(TALLA_BANK).slice(0,n).map(s=>({s}));
  if(kind==='sil') return shuffle(SIL_BANK).slice(0,n).map(([x,f])=>({syl:x.split('·'),w:x.replace(/·/g,''),f}));
  if(kind==='punts') return shuffle(PUNTS_BANK).slice(0,n).map(sents=>({sents}));
  if(kind==='kara'){const K=karaState();const ss=SONGS.slice().sort((a,b)=>(K.best[a.id]||0)-(K.best[b.id]||0));return [ss[Math.random()*2|0]]}
  if(kind==='cursa'||kind==='conq') return [{}];
}
function stopGame(){if(G&&G.cleanup)G.cleanup();if(G)G.stop=true}
function exitGame(){stopGame();G=null;render()}
function reward(first,cat){
  const st=first?3:2, xp=first?10:8;
  G.earned.stars+=st;G.earned.xp+=xp;S.stars+=st;S.xp+=xp;stat(cat,first);
  beep(true);bounce();
}
function miss(cat){G.earned.xp+=2;S.xp+=2;stat(cat,false);beep(false)}
function bounce(){const m=document.getElementById('gMascot');if(m){m.classList.remove('jump');void m.offsetWidth;m.classList.add('jump')}}
function nextItem(){
  G.i++;G.tries=0;G.st={};
  if(G.i>=G.items.length) finishGame();
  renderGame();
}
function finishGame(){
  G.done=true; touchStreak();
  if(G.mission){
    const t=TODAY();
    if(S.missionStepDay!==t){S.missionStep=0;S.missionStepDay=t}
    S.missionStep++;
    if(S.missionStep>=MISSION_LEN){
      S.missionDay=t;S.stars+=25;G.earned.stars+=25;
      G.card=giveCard();
    }
  }
  save();
}
function giveCard(){
  const missing=PCARDS.filter(c=>!S.cards.includes(c.id));
  if(!missing.length){S.stars+=15;return null}
  const c=pick(missing);S.cards.push(c.id);return c;
}

/* ---- ECO ---- */
function graphemes(w){return w.toLowerCase().match(/l·l|ll|ny|ss|rr|qu|gu(?=[eiéèí])|./g)}
const CONF={b:['v'],v:['b'],o:['u'],u:['o'],a:['e'],e:['a','i'],i:['e','ll'],ll:['i','l'],ny:['n','ll'],m:['n'],n:['m'],'ò':['o','ó'],'è':['é','e'],'é':['è','e'],'à':['a'],'í':['i'],'ó':['ò','o'],'ú':['u'],'ç':['s','c'],s:['ss','z'],ss:['s'],z:['s'],g:['j'],j:['g'],t:['d'],d:['t'],x:['ix'],'l·l':['l','ll'],p:['b'],qu:['c','k'],gu:['g','j'],rr:['r'],r:['rr'],c:['qu','k']};
function ecoSetup(it){
  const gs=graphemes(it.w); let pool=new Set();
  gs.forEach(g=>(CONF[g]||[]).forEach(c=>pool.add(c)));
  gs.forEach(g=>pool.delete(g));
  const extra=shuffle([...pool]).slice(0,3);
  G.st.tiles=shuffle(gs.concat(extra)).map((t,i)=>({t,id:i,used:false}));
  G.st.slots=gs.map(()=>null); G.st.n=gs.length; G.st.marks=null;
  const vis=it.mode==='vis'||!caVoice;
  G.st.vis=vis; G.st.peek=vis; G.st.init=true; G.st.looks=0;
  if(!vis) setTimeout(()=>sayDict(it),350);
  else peekTimer(9000);
}
function peekTimer(ms){clearTimeout(G.st.pt);const gi=G.i;G.st.pt=setTimeout(()=>{if(G&&G.i===gi&&G.st.peek){G.st.peek=false;renderGame()}},ms)}
function sayDict(it,slow){
  if(!say(it.w,slow)) return;
  if(it.f){try{[it.f,it.w].forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.voice=caVoice;u.lang=caVoice.lang;u.rate=slow?.6:.85;speechSynthesis.speak(u)})}catch(e){}}
}
function ctxHTML(f,w,show){
  if(!f) return '';
  return `<p class="sentence ctx">${f.split(' ').map(tok=>{
    const core=tok.replace(/^[^\p{L}]+|[^\p{L}·]+$/gu,''), low=core.toLowerCase().replace(/^.*'/,'');
    if(low!==w) return esc(tok);
    const pre=tok.slice(0,tok.length-core.length===0?0:tok.indexOf(core)), apos=core.slice(0,core.length-low.length), post=tok.slice(tok.indexOf(core)+core.length);
    return esc(pre+apos)+(show?`<span class="hl">${esc(core.slice(apos.length))}</span>`:`<span class="blank" aria-label="paraula amagada"></span>`)+esc(post);
  }).join(' ')}</p>`;
}
function ecoHTML(){
  const it=G.items[G.i]; if(!G.st.init) ecoSetup(it);
  const st=G.st, full=st.slots.every(Boolean);
  if(st.peek) return `<div class="stage"><p class="muted">Fes-li una foto amb els ulls. Fixa't en les lletres difícils.</p>
    ${stickerHTML(it.w,true)}<p class="word big">${S.dict&&S.dict[it.w]?wordHL(it.w,S.dict[it.w].hl):esc(it.w)}</p>${ctxHTML(it.f,it.w,true)}
    <button class="btn" data-act="gotIt">${IC.eye}Ja la tinc!</button></div>`;
  const alienIntro=it.mode==='alien'?`<p class="muted"><b>Missatge del planeta Lila!</b> Aquesta paraula <b>no existeix</b>: escriu-la tal com sona.</p>`:'';
  const voice=alienIntro+(!st.vis?`<div class="speak"><button class="btn menta" data-act="say">${IC.speaker}Escolta</button><button class="btn alt" data-act="saySlow">${IC.snail}A poc a poc</button></div>${ctxHTML(it.f,it.w,st.ok||st.over)}`
   :`${ctxHTML(it.f,it.w,st.ok||st.over)}${st.ok||st.over?'':`<div class="speak"><button class="btn alt" data-act="peek">${IC.eye}Mira-la un altre cop</button></div>`}
     ${caVoice||it.mode==='vis'?'':'<p class="muted small">Aquesta tauleta no té veu en català, així que les paraules es miren en lloc d\'escoltar-les.</p>'}`);
  const slots=`<div class="slots" aria-label="Espais per a la paraula">${st.slots.map((s,i)=>{const cls=st.marks?(st.marks[i]?'ok':'bad'):(s?'full':'');return `<button class="slot ${s?cls||'full':cls}" data-act="unslot" data-i="${i}" ${st.ok||st.over?'disabled':''}>${s?esc(s.t):''}</button>`}).join('')}</div>
    <p class="muted small">${st.n} fitxes. Compta-les: cap so s'ha de quedar fora.</p>`;
  const pool=`<div class="pool">${st.tiles.map(t=>`<button class="tile ${t.used?'used':''}" data-act="tile" data-id="${t.id}" ${st.ok||st.over?'disabled':''}>${esc(t.t)}</button>`).join('')}</div>`;
  let fb='',actions='';
  if(st.ok){fb=`<div class="feedback ok">${G.tries>1?'Bona correcció! Has trobat l\'error tu sola.':'Perfecta! '+esc(it.w)}</div>`;actions=`<button class="btn" data-act="next">Següent</button>`}
  else if(st.over){fb=`<div class="feedback no">S'escriu <b style="font-family:var(--tile);font-size:26px">${diffWord(it.w,st.slots.map(s=>s?s.t:'').join(''))}</b>${it.pista?`<br>${esc(it.pista)}`:''}${it.mode==='alien'?'':'<br><span class="muted small">L\'he guardat a la llibreta per repassar-la.</span>'}</div>`;actions=`<button class="btn" data-act="next">Següent</button>`}
  else if(st.marks){fb=`<div class="feedback try">Gairebé! Les fitxes verdes estan bé. Canvia les roses i torna-ho a provar.</div>`;actions=`<button class="btn" data-act="ecoCheck" ${full?'':'disabled'}>Comprova</button>`}
  else actions=`<button class="btn" data-act="ecoCheck" ${full?'':'disabled'}>Comprova</button>`;
  return `<div class="stage">${voice}${slots}${pool}${fb}<div class="speak">${actions}</div></div>`;
}
function diffWord(right){return graphemes(right).map(g=>esc(g)).join('')}
function ecoCheck(){
  const it=G.items[G.i], st=G.st, gs=graphemes(it.w);
  const typed=st.slots.map(s=>s.t);
  G.tries++;
  const cat=it.mode==='alien'?'alien':'eco';
  if(typed.join('')===gs.join('')){st.ok=true;reward(G.tries===1,cat);if(it.mode==='alien'){save();return renderGame()}if(G.items[G.i].ll||S.llibreta.some(e=>e.w===it.w)) llResult(it.w,G.tries===1);save();return renderGame();}
  if(G.tries>=2){st.over=true;st.marks=gs.map((g,i)=>typed[i]===g);miss(cat);
    if(it.mode==='alien'){}else if(llAdd(it.w,it.pista,'eco')) G.newWords.push(it.w); else llResult(it.w,false);
    save();return renderGame();}
  st.marks=gs.map((g,i)=>typed[i]===g);beep(false);
  // return wrong tiles to the pool
  st.slots=st.slots.map((s,i)=>{if(st.marks[i]) return s; st.tiles.find(t=>t.id===s.id).used=false; return null});
  renderGame();
}

/* ---- DETECTIU ---- */
function famHTML(f){return esc(f).replace(/\[(.+?)\]/,'<span class="hl">$1</span>')}
function detWord(it,fill,hl){const v=fill==='res'?'':fill;return esc(it.p).replace('_',hl?`<span class="hl">${esc(v)}</span>`:`<span class="gap">${fill?esc(v)||'&nbsp;':'&nbsp;'}</span>`)}
function detHTML(){
  const it=G.items[G.i], st=G.st;
  const word=st.ok||st.over?detWord(it,it.a,true):detWord(it,'',false);
  const clue=st.clue||st.over||st.ok?`<div class="fam">Paraula germana: <b>${famHTML(it.f)}</b><br><span class="small muted">Aquí la lletra sona clara. Fes-la servir.</span></div>`
    :`<button class="btn alt" data-act="clue">${IC.lupa}Busca la família</button>`;
  const opts=`<div class="opts">${it.o.map(o=>`<button class="opt ${st.wrong&&st.wrong.includes(o)?'bad':''} ${(st.ok||st.over)&&o===it.a?'ok':''}" data-act="detPick" data-o="${esc(o)}" ${st.ok||st.over||(st.wrong&&st.wrong.includes(o))?'disabled':''}>${o==='res'?'<span style="font-size:20px">no hi va res</span>':esc(o)}</button>`).join('')}</div>`;
  let fb='';
  const full=it.p.replace('_',it.a==='res'?'':it.a), fam=it.f.replace(/[\[\]]/g,'');
  if(st.ok) fb=`<div class="feedback ok">${G.tries>1?'Bona correcció! ':'Exacte! '}Com a <b>${esc(fam)}</b>, s'escriu <b>${esc(full)}</b>.</div>`;
  else if(st.over) fb=`<div class="feedback no">S'escriu <b>${esc(full)}</b>, perquè ve de <b>${esc(fam)}</b>.</div>`;
  else if(st.wrong) fb=`<div class="feedback try">Mmm, no. Mira la paraula germana i torna-ho a provar.</div>`;
  return `<div class="stage"><p class="muted">Quina lletra falta a la paraula destacada?</p>${it.s?`<p class="sentence">${esc(it.s).replace(esc(it.p),`<span class="word tw">${word}</span>`)}</p>`:`<p class="word">${word}</p>`}${clue}${opts}${fb}${st.ok||st.over?`<button class="btn" data-act="next">Següent</button>`:''}</div>`;
}
function detPick(o){
  const it=G.items[G.i], st=G.st; G.tries++;
  const full=it.p.replace('_',it.a==='res'?'':it.a);
  if(o===it.a){st.ok=true;reward(G.tries===1,it.c);}
  else{st.wrong=(st.wrong||[]).concat(o);st.clue=true;
    if(G.tries>=2||st.wrong.length>=it.o.length-1){st.over=true;miss(it.c);if(llAdd(full,'Família: '+it.f.replace(/[\[\]]/g,''),it.c))G.newWords.push(full)}
    else beep(false);}
  save();renderGame();
}

/* ---- TRUCS ---- */
function trucHTML(){
  const R=RULES[G.rule];
  if(G.showRule) return `<div class="stage"><div class="rulecard stack" style="gap:8px"><span class="small" style="font-weight:800;letter-spacing:.6px;text-transform:uppercase">${R.name}</span><h3>${R.title}</h3><p style="font-family:var(--tile);font-size:22px">${R.ex}</p><p class="small">Però compte: alguna frase farà trampa!</p></div><button class="btn" data-act="ruleOk">Som-hi</button></div>`;
  const it=G.items[G.i], st=G.st;
  const done=st.ok||st.over;
  const sent=esc(it.s).replace('_',done?`<span class="hl" style="color:var(--menta)">${esc(it.a)}</span>`:`<span class="gap" style="display:inline-block;min-width:1.2em;border-bottom:4px solid var(--rosa)">&nbsp;</span>`);
  const opts=`<div class="opts">${R.o.map(o=>`<button class="opt ${st.wrong===o?'bad':''} ${done&&o===it.a?'ok':''}" data-act="trucPick" data-o="${o}" ${done||st.wrong===o?'disabled':''}>${o}</button>`).join('')}</div>`;
  let fb='';
  if(st.ok) fb=`<div class="feedback ok">${it.why?'Molt bé, no t\'ha enganyat! '+esc(it.why):(G.tries>1?'Bona correcció! ':'Truc aplicat! ')+esc(R.title)+'.'}</div>`;
  else if(st.over) fb=`<div class="feedback no">${it.why?esc(it.why):esc(R.title)+'.'}</div>`;
  return `<div class="stage"><p class="sentence">${sent}</p>${opts}${fb}${done?`<button class="btn" data-act="next">Següent</button>`:''}</div>`;
}
function trucPick(o){
  const it=G.items[G.i], st=G.st; G.tries++;
  if(o===it.a){st.ok=true;reward(G.tries===1,it.rule)}
  else{st.wrong=o;
    st.over=true;miss(it.rule);
    const w=(it.s.match(/\S*_\S*/)||[''])[0].replace('_',it.a).replace(/[.,?!]/g,'').replace(/^.*'/,'');
    if(w&&llAdd(w,it.why?'':RULES[it.rule].title+'.',it.rule))G.newWords.push(w.toLowerCase());}
  save();renderGame();
}

/* ---- TALLA ---- */
function tallaSetup(it){
  const words=it.s.split(' '); const chars=[]; const cuts=new Set(); let pos=0;
  words.forEach((w,wi)=>{for(const ch of w){chars.push(ch);pos++} if(wi<words.length-1) cuts.add(pos)});
  G.st.chars=chars;G.st.target=cuts;G.st.on=new Set();G.st.init=true;
}
function tallaHTML(){
  const it=G.items[G.i]; if(!G.st.init) tallaSetup(it);
  const st=G.st, done=st.ok||st.over;
  let line='';
  st.chars.forEach((ch,i)=>{
    line+=`<span class="ch">${esc(ch)}</span>`;
    if(i<st.chars.length-1){const p=i+1;let cls=st.on.has(p)?'on':'';
      if(st.marks){if(st.target.has(p)&&!st.on.has(p))cls='miss';else if(!st.target.has(p)&&st.on.has(p))cls='extra'}
      if(done&&st.target.has(p))cls='on';
      line+=`<button class="cut ${cls}" data-act="cut" data-p="${p}" aria-label="Talla aquí" ${done?'disabled':''}></button>`;}
  });
  let fb='';
  if(st.ok) fb=`<div class="feedback ok">${G.tries>1?'Bona correcció!':'Totes les paraules al seu lloc!'}</div>`;
  else if(st.over) fb=`<div class="feedback no">Així queda: <b>${esc(it.s)}</b>. Recorda que <b>l'</b> va enganxada amb apòstrof.</div>`;
  else if(st.marks) fb=`<div class="feedback try">Gairebé! Les línies verdes són talls que falten; les taronges sobren.</div>`;
  return `<div class="stage"><p class="muted">Toca entre les lletres per tallar la frase en paraules.</p><div class="cutline">${line}</div>${fb}
    <div class="speak">${done?`<button class="btn" data-act="next">Següent</button>`:`<button class="btn alt" data-act="sayS" ${caVoice?'':'hidden'}>${IC.speaker}Escolta la frase</button><button class="btn" data-act="tallaCheck">Comprova</button>`}</div></div>`;
}
function tallaCheck(){
  const st=G.st; G.tries++;
  const same=st.on.size===st.target.size&&[...st.target].every(p=>st.on.has(p));
  if(same){st.ok=true;st.marks=null;reward(G.tries===1,'talla')}
  else if(G.tries>=2){st.over=true;miss('talla')}
  else{st.marks=true;beep(false)}
  save();renderGame();
}

function missionFor(day){

  return [['eco',4],[['det','sil','logic'][h%3],4],[(h>>2)%2?'truc':'cursa',(h>>2)%2?5:12],[third,third==='kara'?1:2]];
}
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lowFirst=s=>s.charAt(0).toLowerCase()+s.slice(1);
function misspell(w){
  const out=new Set(), V='aeiouàèéíòóúïü';
  const sub=(i,len,to)=>out.add(w.slice(0,i)+to+w.slice(i+len));
  for(let i=0;i<w.length;i++){
    const c=w[i],n=w[i+1]||'',p=w[i-1]||'';
    if(c==='v') sub(i,1,'b'); else if(c==='b') sub(i,1,'v');
    if(c==='l'&&n==='l'&&w[i+2]!=='·') sub(i,2,'i');
    if(c==='i'&&p&&n&&V.includes(p)&&V.includes(n)) sub(i,1,'ll');
    if(c==='m'&&(n==='p'||n==='b')) sub(i,1,'n');
    const acc={'à':'a','è':'e','é':'e','í':'i','ò':'o','ó':'o','ú':'u'}[c]; if(acc) sub(i,1,acc);
    if(c==='t'&&i===w.length-1&&(p==='n'||p==='l')) sub(i,1,'');
    if(c==='o'&&i>0&&i<w.length-1) sub(i,1,'u');
    if(c==='u'&&i>0&&i<w.length-1&&p!=='q'&&p!=='g') sub(i,1,'o');
  }
  out.delete(w); const a=[...out]; return a.length?pick(a):null;
}
function wordPool(){
  const s=new Set(ECO_BANK.map(b=>b[0]));
  DET_BANK.forEach(d=>s.add(d.p.replace('_',d.a==='res'?'':d.a)));
  S.llibreta.forEach(e=>{if(/^[a-zàèéíïòóúüç·]+$/.test(e.w)) s.add(e.w)});
  return [...s].filter(w=>w.length<=12&&misspell(w));
}
function quickQuestions(){
  const q=[];
  Object.values(RULES).forEach(R=>R.items.forEach(x=>q.push({p:x[0],a:x[1],o:R.o,why:x[2]||R.title})));

  return q;
}
/* tricky letters: default highlight for the visual dictionary */
function trickyIdx(w){
  const gs=graphemes(w), out=[];
  gs.forEach((g,i)=>{const n=gs[i+1]||'';
    if(['b','v','ll','h','ç','x','ix','tx','ny','l·l','ss','z'].includes(g)||/[àèéíòóúïü]/.test(g)) out.push(i);
    else if(g==='i'&&/[aeiouàèéíòóú]/.test(gs[i-1]||'')&&/[aeiouàèéíòóú]/.test(n)) out.push(i);
    else if(g==='m'&&(n==='p'||n==='b')) out.push(i);

    else if(i===gs.length-1&&/[tdcg]/.test(g)&&gs[i-1]&&!/[aeiou]/.test(gs[i-1])) out.push(i);
  });
  return out;
}

function puntsSetup(it){

    if(i<st.toks.length-1){const p=i+1;let cls=st.on.has(p)?'on':'';

}

  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(mascotSVG({st:stage(),wear:S.wearing}));
  const mk=(id,x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)own[I(x+i,y+j)]=id;return{id,x,y,sx:x,sy:y,dx:1,dy:0,trail:false,plan:[],skip:0}};
  const P=mk(1,5,N-6), B=[mk(2,N-6,5),mk(3,N-6,N-6)];B[0].dx=-1;B[1].dx=-1;
  const E=[P,...B];
  const qs=shuffle(quickQuestions());let qi=0,Q=null,orbs=[],msg='',time=90,ticks=0,okN=0;
  const newQ=()=>{Q=qs[qi++%qs.length];orbs=Q.o.map(l=>{let x,y,t=0;do{x=1+Math.random()*(N-2)|0;y=1+Math.random()*(N-2)|0}while((Math.abs(x-P.x)+Math.abs(y-P.y)<5||orbs.some&&false)&&t++<50);return{x,y,l}});
    // make sure orbs don't overlap
    if(orbs.length>1&&orbs[0].x===orbs[1].x&&orbs[0].y===orbs[1].y)orbs[1].x=(orbs[1].x+3)%N;
    showQ()};
  const showQ=()=>{const el=document.getElementById('cQ');if(!el)return;el.innerHTML=`<span class="sentence">${esc(Q.p).replace('_','<span class="gap">&nbsp;</span>')}</span>${msg?`<span class="small cqmsg">${esc(msg)}</span>`:''}`};
  const cut=id=>{for(let i=0;i<N*N;i++)if(trail[i]===id)trail[i]=0;const e=E[id-1];e.trail=false;e.plan=[];
    let has=false;for(let i=0;i<N*N;i++)if(own[i]===id){has=true;break}
    if(!has){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)own[I(e.sx+i,e.sy+j)]=id}
    if(own[I(e.x,e.y)]!==id){let best=null,bd=1e9;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(own[I(x,y)]===id){const d=Math.abs(x-e.x)+Math.abs(y-e.y);if(d<bd){bd=d;best=[x,y]}}if(best){e.x=best[0];e.y=best[1]}}};
  const capture=id=>{
    for(let i=0;i<N*N;i++)if(trail[i]===id){trail[i]=0;own[i]=id}
    const seen=new Uint8Array(N*N),st=[];
    for(let x=0;x<N;x++)for(const y of [0,N-1]){if(own[I(x,y)]!==id&&!seen[I(x,y)]){seen[I(x,y)]=1;st.push(I(x,y))}}
    for(let y=0;y<N;y++)for(const x of [0,N-1]){if(own[I(x,y)]!==id&&!seen[I(x,y)]){seen[I(x,y)]=1;st.push(I(x,y))}}
    while(st.length){const c=st.pop(),x=c%N,y=c/N|0;for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;const k=I(nx,ny);if(!seen[k]&&own[k]!==id){seen[k]=1;st.push(k)}}}
    for(let i=0;i<N*N;i++)if(!seen[i]&&own[i]!==id){own[i]=id;if(trail[i]&&trail[i]!==id){}}
    E[id-1].trail=false;
  };
  const claimArea=(cx,cy,r)=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>=0&&y>=0&&x<N&&y<N){own[I(x,y)]=1;if(trail[I(x,y)]===1)trail[I(x,y)]=0}};
  const move=e=>{
    let nx=e.x+e.dx,ny=e.y+e.dy;
    if(nx<0||ny<0||nx>=N||ny>=N){if(e.id===1)return;[e.dx,e.dy]=[-e.dy,e.dx];e.plan=[];return}
    const k=I(nx,ny),t=trail[k];
    if(t===e.id){cut(e.id);if(e.id===1){msg='Has trepitjat el teu propi rastre. Torna a provar-ho!';showQ()}return}
    e.x=nx;e.y=ny;
    if(t&&t!==e.id){cut(t);if(t===1){msg='Un rival t\'ha tallat el rastre! Torna a sortir.';showQ()}else if(e.id===1){S.stars+=1;G.earned.stars+=1;msg='Has tallat el rastre d\'un rival! +1 estrella';showQ()}}
    if(own[k]===e.id){if(e.trail)capture(e.id)}else{trail[k]=e.id;e.trail=true}
    if(e.id===1){const o=orbs.find(o=>o.x===nx&&o.y===ny);if(o){
      if(o.l===Q.a){okN++;claimArea(nx,ny,2);capture(1);reward(true,'conq');msg='';newQ()}
      else{orbs=orbs.filter(x=>x!==o);stat('conq',false);beep(false);msg='No és aquesta. '+Q.why;showQ()}}}
  };
  const botThink=b=>{
    const inHome=own[I(b.x,b.y)]===b.id;
    if(!b.plan.length){
      if(inHome){const dirs=[[1,0],[-1,0],[0,1],[0,-1]];const d=pick(dirs),r=[-d[1],d[0]],a=3+Math.random()*4|0,c=3+Math.random()*4|0;
        b.plan=[...Array(a).fill(d),...Array(c).fill(r),...Array(a+1).fill([-d[0],-d[1]])]}
      else{let best=null,bd=1e9;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(own[I(x,y)]===b.id){const dd=Math.abs(x-b.x)+Math.abs(y-b.y);if(dd<bd){bd=dd;best=[x,y]}}
        if(best){const dx=Math.sign(best[0]-b.x),dy=Math.sign(best[1]-b.y);b.plan=[dx&&(!dy||Math.random()<.5)?[dx,0]:[0,dy]]}}
    }
    let d=b.plan.shift()||[b.dx,b.dy];
    const bad=dd=>{const nx=b.x+dd[0],ny=b.y+dd[1];return nx<0||ny<0||nx>=N||ny>=N||trail[I(nx,ny)]===b.id||(dd[0]===-b.dx&&dd[1]===-b.dy&&b.trail)};
    if(bad(d)){const alt=shuffle([[1,0],[-1,0],[0,1],[0,-1]]).find(x=>!bad(x));if(alt)d=alt;b.plan=[]}
    b.dx=d[0];b.dy=d[1];
  };
  const pct=()=>{let c=0;for(let i=0;i<N*N;i++)if(own[i]===1)c++;return Math.round(c/(N*N)*100)};
  const draw=()=>{
    ctx.fillStyle='#231533';ctx.fillRect(0,0,W,W);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const k=I(x,y);
      if(own[k]){ctx.fillStyle=COL[own[k]][0];ctx.fillRect(x*cs,y*cs,cs+.5,cs+.5)}
      else if((x+y)%2){ctx.fillStyle='#2a1a3d';ctx.fillRect(x*cs,y*cs,cs,cs)}
      if(trail[k]){ctx.fillStyle=COL[trail[k]][1];ctx.fillRect(x*cs+2,y*cs+2,cs-4,cs-4)}}
    const pulse=1+Math.sin(ticks/2)*.08;
    orbs.forEach(o=>{ctx.fillStyle='#f7f0fd';ctx.beginPath();ctx.arc(o.x*cs+cs/2,o.y*cs+cs/2,cs*.75*pulse,0,7);ctx.fill();ctx.strokeStyle='#c9a7ff';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#1a1024';ctx.font=`600 ${Math.round(cs*.85)}px Lexend, Nunito, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.l,o.x*cs+cs/2,o.y*cs+cs/2+1)});
    B.forEach(b=>{ctx.fillStyle=COL[b.id][0];ctx.strokeStyle='#1a1024';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect?ctx.roundRect(b.x*cs+1,b.y*cs+1,cs-2,cs-2,5):ctx.rect(b.x*cs,b.y*cs,cs,cs);ctx.fill();ctx.stroke();
      ctx.fillStyle='#1a1024';ctx.fillRect(b.x*cs+cs*.28,b.y*cs+cs*.35,3,4);ctx.fillRect(b.x*cs+cs*.62,b.y*cs+cs*.35,3,4)});
    const s=cs*2.1;if(img.complete&&img.naturalWidth)ctx.drawImage(img,P.x*cs+cs/2-s/2,P.y*cs+cs/2-s/2-2,s,s);
    if(!started){ctx.fillStyle='#1a1024cc';ctx.fillRect(0,0,W,W);ctx.fillStyle='#f7f0fd';ctx.font='800 26px Grandstander, Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('Toca per començar!',W/2,W/2)}
  };
  let started=false,stop=false;
  const end=()=>{stop=true;clearInterval(G.iv);const p=pct();const bonus=Math.round(p/4);S.stars+=bonus;G.earned.stars+=bonus;S.xp+=p;G.earned.xp+=p;
    G.extra=`Has conquerit el ${p}% del mapa i has encertat ${okN} lletres.`;S.conqBest=Math.max(S.conqBest||0,p);G.stop=true;finishGame();renderGame()};
  const tick=()=>{
    if(stop||!G||G.stop)return; if(!started){draw();return}
    ticks++; move(P); B.forEach(b=>{if(++b.skip%3===0)return;botThink(b);move(b)});
    if(ticks%7===0){time--;document.getElementById('cTime').textContent=time+' s';document.getElementById('cPct').textContent=pct()+'%';if(time<=0)return end()}
    draw();
  };
  const setDir=(dx,dy)=>{if(P.trail&&dx===-P.dx&&dy===-P.dy)return;P.dx=dx;P.dy=dy};
  let ps=null;
  cv.addEventListener('pointerdown',e=>{if(!started){started=true;return}const r=cv.getBoundingClientRect(),x=e.clientX-r.left-(P.x+.5)*cs,y=e.clientY-r.top-(P.y+.5)*cs;
    if(Math.abs(x)>Math.abs(y))setDir(Math.sign(x),0);else setDir(0,Math.sign(y));ps=[e.clientX,e.clientY]});
  cv.addEventListener('pointermove',e=>{if(!ps)return;const dx=e.clientX-ps[0],dy=e.clientY-ps[1];if(Math.hypot(dx,dy)>22){if(Math.abs(dx)>Math.abs(dy))setDir(Math.sign(dx),0);else setDir(0,Math.sign(dy));ps=[e.clientX,e.clientY]}});
  cv.addEventListener('pointerup',()=>ps=null);cv.style.touchAction='none';
  const key=e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();if(!started)started=true;setDir(...m)}};
  document.addEventListener('keydown',key);
  newQ();G.iv=setInterval(tick,140);draw();
  G.cleanup=()=>{stop=true;clearInterval(G.iv);document.removeEventListener('keydown',key)};
}

/* ============ PHASE 3 · PARAULES ALIENÍGENES (pseudoword dictation) ============ */
const ALIEN = [
  'tafi','lemu','doxi','fanu','nodi','xelu','pafu','sedu','tomi','fixu','dalu','nefi','gofi','lixu','mopi','dafu',
  'panyi','lenyu','fallu','dollu','marri','forru','taqui','loqui','fegui','nogui','massu','pessi','mesu','fosi',
  'munet','pidol','nuxal','silup','tifec','dumal'
];
function alienHint(w){
  if(w.includes('qu')) return 'El so /k/ davant de e o i s\'escriu amb qu.';
  if(/gu[ei]/.test(w)) return 'El so /g/ davant de e o i s\'escriu amb gu.';
  if(w.includes('ss')) return 'La s forta entre vocals s\'escriu amb dues s.';
  if(/[aeiou]s[aeiou]/.test(w)) return 'La s suau (la que fa zzz) entre vocals s\'escriu amb una sola s.';
  if(w.includes('rr')) return 'La r forta entre vocals s\'escriu amb dues r.';
  if(w.includes('ny')) return 'El so ny s\'escriu amb n i y.';
  if(w.includes('ll')) return 'El so ll s\'escriu amb dues l.';
  return 'Escolta cada so i posa-hi una fitxa. Cap so s\'ha de quedar fora.';
}
function alienItems(n){return shuffle(ALIEN).slice(0,n).map(w=>({w,pista:alienHint(w),f:'',mode:'alien'}))}

/* ============ PHASE 3 · LABORATORI DE PATRONS (fluid reasoning) ============ */
const SH=['cercle','quadrat','triangle','estrella','cor','rombe'];
const CO=['#ff74b8','#7ff0c9','#ffd66b','#c9a7ff','#7fb8ff'];
const CO_NAME={'#ff74b8':'rosa','#7ff0c9':'menta','#ffd66b':'groc','#c9a7ff':'lila','#7fb8ff':'blau'};
function shp(o){
  const {s,c,n=1,r=0}=o;
  const one=(cx,cy,q)=>{switch(s){
    case 'cercle':return `<circle cx="${cx}" cy="${cy}" r="${q}"/>`;
    case 'quadrat':return `<rect x="${cx-q}" y="${cy-q}" width="${2*q}" height="${2*q}" rx="${q*.2}"/>`;
    case 'triangle':return `<path d="M${cx} ${cy-q} L${cx+q} ${cy+q*.8} L${cx-q} ${cy+q*.8}Z"/>`;
    case 'estrella':return `<path d="${starPath(cx,cy,q*1.15,q*.5)}"/>`;
    case 'cor':return `<path d="M${cx} ${cy+q*.9} C${cx-q*1.6} ${cy-q*.2} ${cx-q*.6} ${cy-q*1.3} ${cx} ${cy-q*.4} C${cx+q*.6} ${cy-q*1.3} ${cx+q*1.6} ${cy-q*.2} ${cx} ${cy+q*.9}Z"/>`;
    default:return `<path d="M${cx} ${cy-q} L${cx+q} ${cy} L${cx} ${cy+q} L${cx-q} ${cy}Z"/>`}};
  const pos={1:[[30,30,18]],2:[[17,30,11],[43,30,11]],3:[[30,17,10],[17,42,10],[43,42,10]],4:[[18,18,10],[42,18,10],[18,42,10],[42,42,10]]}[n];
  return `<svg viewBox="0 0 60 60" class="shp" aria-hidden="true"><g fill="${c}" stroke="#1a1024" stroke-width="2.2" stroke-linejoin="round" transform="rotate(${r} 30 30)">${pos.map(p=>one(...p)).join('')}</g></svg>`;
}
const okey=o=>[o.s,o.c,o.n||1,o.r||0].join('|');
function optionsFrom(correct,cands){
  const seen=new Set([okey(correct)]),out=[correct];
  for(const c of shuffle(cands)){if(out.length>=4)break;const k=okey(c);if(!seen.has(k)){seen.add(k);out.push(c)}}
  while(out.length<4){const c={...correct,c:pick(CO),s:pick(SH)};const k=okey(c);if(!seen.has(k)){seen.add(k);out.push(c)}}
  return shuffle(out);
}
function genSerie(lvl){
  const ss=shuffle(SH), cs=shuffle(CO);
  let seq=[], rule='';
  if(lvl===1){const k=2+(Math.random()<.5?0:1);const E=[...Array(k)].map((_,i)=>({s:ss[i],c:cs[i]}));
    for(let i=0;i<7;i++)seq.push(E[i%k]);rule=`Es repeteix un grup de ${k} peces, sempre en el mateix ordre.`}
  else if(lvl===2){const t=pick(['aab','abb','count','rot']);
    if(t==='count'){const s=ss[0],c=cs[0];for(let i=0;i<7;i++)seq.push({s,c,n:1+i%3});rule='El número de peces fa 1, 2, 3 i torna a començar.'}
    else if(t==='rot'){for(let i=0;i<7;i++)seq.push({s:'triangle',c:cs[0],r:(i%4)*90});rule='El triangle gira un quart de volta cada vegada, com les agulles del rellotge.'}
    else{const A={s:ss[0],c:cs[0]},B={s:ss[1],c:cs[1]};const pat=t==='aab'?[A,A,B]:[A,B,B];for(let i=0;i<7;i++)seq.push(pat[i%3]);rule=t==='aab'?'El grup és: dues iguals i una de diferent.':'El grup és: una i després dues iguals.'}}
  else{const sp=[ss[0],ss[1]],cp=[cs[0],cs[1],cs[2]];for(let i=0;i<7;i++)seq.push({s:sp[i%2],c:cp[i%3]});rule='La forma canvia cada 2 i el color cada 3: són dues sèries alhora. Mira-les per separat.'}
  const ans=seq[6], shown=seq.slice(0,6);
  const cands=[...shown,{...ans,c:pick(CO.filter(c=>c!==ans.c))},{...ans,s:pick(SH.filter(s=>s!==ans.s))},{...ans,n:ans.n?(ans.n%3)+1:2},{...ans,r:((ans.r||0)+90)%360}];
  return {type:'serie',shown,ans,opts:optionsFrom(ans,cands),rule,hint:'Digues en veu alta el que veus: «cor rosa, estrella menta…». Què es repeteix?'};
}
function genMatriu(lvl){
  const N=lvl===1?2:3, ss=shuffle(SH).slice(0,N), cs=shuffle(CO).slice(0,N);
  const cell=(i,j)=>lvl<3?{s:ss[i],c:cs[j]}:{s:ss[i],c:cs[i],n:j+1};
  const grid=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)grid.push(cell(i,j));
  const ans=grid[N*N-1];
  const cands=grid.slice(0,-1).concat([{...ans,c:pick(CO.filter(c=>c!==ans.c))},{...ans,s:pick(SH.filter(s=>s!==ans.s))},{...ans,n:((ans.n||1)%3)+1}]);
  const rule=lvl<3?'A cada fila la forma és la mateixa. A cada columna el color és el mateix.':'A cada fila la forma i el color són iguals. A cada columna hi ha el mateix número de peces.';
  return {type:'matriu',N,grid,ans,opts:optionsFrom(ans,cands),rule,hint:'Mira primer la fila de baix: què tenen en comú? Després mira la columna de la dreta.'};
}
function genBalanca(lvl){
  const em=shuffle(['🍓','⭐','🍫','🎀','🍭','💎','🧁','🎧']);const [A,B,C]=em;
  const rep=(e,n)=>e.repeat(n);
  if(lvl===1){const n=2+(Math.random()*2|0),k=2;
    return {type:'balanca',scales:[[A,rep(B,n)]],q:[rep(A,k),'?'],unit:B,ans:n*k,rule:`Un ${A} pesa com ${n} ${B}. Si en tens ${k}, necessites ${n}+${n} = ${n*k} ${B}.`,hint:`Primer: quants ${B} pesa un sol ${A}?`}}
  if(lvl===2){const n=2+(Math.random()*2|0),m=2;
    return {type:'balanca',scales:[[A,rep(B,n)],[B,rep(C,m)]],q:[A,'?'],unit:C,ans:n*m,rule:`Un ${A} són ${n} ${B}, i cada ${B} són ${m} ${C}. Per tant: ${n} vegades ${m} = ${n*m} ${C}.`,hint:`Canvia cada ${B} per ${m} ${C}.`}}
  const a=2+(Math.random()*2|0),b=2+(Math.random()*2|0);
  return {type:'balanca',scales:[[A+B,rep(C,a+b)],[A,rep(C,a)]],q:[B,'?'],unit:C,ans:b,rule:`${A}${B} junts pesen ${a+b} ${C}. Si ${A} sol en pesa ${a}, a ${B} li queden ${a+b} − ${a} = ${b}.`,hint:`Treu el ${A} de les dues bandes. Què queda?`};
}
function logicState(){S.logic=S.logic||{serie:1,matriu:1,balanca:1,run:{}};return S.logic}
function logicItems(n){const L=logicState();const types=shuffle(['serie','matriu','balanca']);return [...Array(n)].map((_,i)=>{const t=types[i%3];return t==='serie'?genSerie(L.serie):t==='matriu'?genMatriu(L.matriu):genBalanca(L.balanca)})}
function balHTML(l,r,big){return `<div class="bal ${big?'q':''}"><div class="pan">${l}</div><div class="beam"><span>=</span></div><div class="pan">${r==='?'?'<b class="qm">?</b>':r}</div></div>`}
function logicHTML(){
  const it=G.items[G.i], st=G.st, done=st.ok||st.over;
  let prompt='',board='',opts='';
  if(it.type==='serie'){prompt='Quina peça va <b>després</b>?';
    board=`<div class="seq">${it.shown.map(o=>`<span class="cell">${shp(o)}</span>`).join('')}<span class="cell q">${done?shp(it.ans):'<b class="qm">?</b>'}</span></div>`}
  if(it.type==='matriu'){prompt='Quina peça <b>falta</b> a la graella?';
    board=`<div class="mat" style="grid-template-columns:repeat(${it.N},1fr)">${it.grid.map((o,k)=>k===it.grid.length-1?`<span class="cell q">${done?shp(o):'<b class="qm">?</b>'}</span>`:`<span class="cell">${shp(o)}</span>`).join('')}</div>`}
  if(it.type==='balanca'){prompt=`Les balances estan <b>equilibrades</b>. Quants ${it.unit} fan falta?`;
    board=`<div class="stack" style="gap:10px;align-items:center">${it.scales.map(s=>balHTML(s[0],s[1])).join('')}${balHTML(it.q[0],done?it.unit.repeat(it.ans):'?',true)}</div>`}
  const list=it.type==='balanca'?shuffle([...new Set([it.ans,it.ans+1,Math.max(1,it.ans-1),it.ans+2,Math.max(1,it.ans-2)])]).slice(0,4):it.opts;
  if(it.type==='balanca'&&!list.includes(it.ans)) list[0]=it.ans;
  if(!st.list) st.list=it.type==='balanca'?list.sort((a,b)=>a-b):list;
  opts=`<div class="opts">${st.list.map((o,i)=>{const isAns=it.type==='balanca'?o===it.ans:okey(o)===okey(it.ans);const wrong=st.wrong&&st.wrong.includes(i);
    return `<button class="opt lopt ${wrong?'bad':''} ${done&&isAns?'ok':''}" data-act="logicPick" data-i="${i}" ${done||wrong?'disabled':''} aria-label="Opció ${i+1}">${it.type==='balanca'?o:shp(o)}</button>`}).join('')}</div>`;
  let fb='';
  if(st.ok) fb=`<div class="feedback ok">${G.tries>1?'Bona correcció! ':'Molt bé! '}${esc(it.rule)}</div>`;
  else if(st.over) fb=`<div class="feedback no">${esc(it.rule)}</div>`;
  else if(st.wrong) fb=`<div class="feedback try">Encara no. <b>Pista:</b> ${esc(it.hint)}</div>`;
  const hintBtn=!done&&!st.wrong&&!st.hint?`<button class="btn alt" data-act="logicHint">Dona'm una pista</button>`:(!done&&st.hint&&!st.wrong?`<div class="fam">${esc(it.hint)}</div>`:'');
  return `<div class="stage"><p class="muted">${prompt}</p>${board}${hintBtn}${opts}${fb}${done?`<button class="btn" data-act="next">Següent</button>`:''}</div>`;
}
function logicPick(i){
  const it=G.items[G.i],st=G.st,L=logicState();G.tries++;
  const o=st.list[i], isAns=it.type==='balanca'?o===it.ans:okey(o)===okey(it.ans);
  const run=L.run[it.type]||0;
  if(isAns){st.ok=true;reward(G.tries===1,it.type);
    if(G.tries===1){L.run[it.type]=run+1;if(L.run[it.type]>=3&&L[it.type]<3){L[it.type]++;L.run[it.type]=0;toast('Nivell més difícil desbloquejat!')}}}
  else{st.wrong=(st.wrong||[]).concat(i);
    if(G.tries>=2){st.over=true;miss(it.type);L.run[it.type]=0;if(L[it.type]>1&&run===0)L[it.type]--;}
    else beep(false);}
  save();renderGame();
}

function handle2(a,b){
  if(a==='logicPick'){logicPick(+b.dataset.i);return true}
  if(a==='logicHint'){G.st.hint=true;renderGame();return true}
  if(a==='silTile'){const t=G.st.tiles.find(x=>x.id==b.dataset.id);const k=G.st.slots.indexOf(null);if(k<0||t.used)return true;t.used=true;G.st.slots[k]=t;G.st.marks=null;renderGame();return true}
  if(a==='silUn'){const i=+b.dataset.i,x=G.st.slots[i];if(!x)return true;G.st.tiles.find(t=>t.id===x.id).used=false;G.st.slots[i]=null;G.st.marks=null;renderGame();return true}
  if(a==='silCheck'){silCheck();return true}
  if(a==='silSay'){say(G.items[G.i].w,true);return true}
  if(a==='dot'){const p=+b.dataset.p;G.st.on.has(p)?G.st.on.delete(p):G.st.on.add(p);G.st.marks=null;renderGame();return true}
  if(a==='puntsCheck'){puntsCheck();return true}
  if(a==='wpm'){const K=karaState();K.wpm=Math.max(20,Math.min(140,K.wpm+ +b.dataset.d));save();renderGame();return true}
  if(a==='karaGo'){karaStart();return true}
  if(a==='karaStop'){clearTimeout(G.st.timer);G.st.phase='ready';G.st.cur=-1;renderGame();return true}
  if(a==='rate'){const K=karaState(),it=G.items[G.i];K.best[it.id]=Math.max(K.best[it.id]||0,K.wpm);K.wpm=Math.max(20,Math.min(140,K.wpm+ +b.dataset.d));S.xp+=10;G.earned.xp+=10;S.stars+=2;G.earned.stars+=2;G.st.phase='q';save();renderGame();return true}
  if(a==='karaAns'){const it=G.items[G.i];G.st.ans=+b.dataset.i;if(G.st.ans===it.q[2])reward(true,'kara');else miss('kara');save();renderGame();return true}
  if(a==='dictOpen'){dictEdit=b.dataset.w;dictDraft=null;dictSlot=0;render();return true}
  if(a==='dictBack'){dictEdit=null;dictDraft=null;render();return true}
  if(a==='dictHL'){const i=+b.dataset.i,h=dictDraft.hl;dictDraft.hl=h.includes(i)?h.filter(x=>x!==i):h.concat(i);renderDictEdit();return true}
  if(a==='dictSlot'){dictSlot=+b.dataset.i;renderDictEdit();return true}
  if(a==='dictEmoji'){dictDraft.e[dictSlot]=b.dataset.e;if(dictSlot===0)dictSlot=1;renderDictEdit();return true}
  if(a==='dictSave'){S.dict=S.dict||{};const first=!S.dict[dictEdit];S.dict[dictEdit]={e:dictDraft.e.slice(),hl:dictDraft.hl.slice()};if(first){S.stars+=3;S.xp+=5;toast('Carta nova al diccionari! +3 estrelles')}else toast('Carta desada.');save();dictEdit=null;dictDraft=null;render();return true}
  if(a==='breakDone'){activeSince=Date.now();view='home';const p=pendingStart;pendingStart=null;if(p)startGame(...p);else render();return true}
  return false;
}
/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const nb=e.target.closest('[data-go]'); if(nb){stopGame();G=null;view=nb.dataset.go;G_reset=false;dictEdit=null;dictDraft=null;render();return}
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='mission'){const t=TODAY();if(S.missionStepDay!==t){S.missionStep=0;S.missionStepDay=t}
    if(S.missionDay===t){G=null;render();return}
    const m=missionFor(t)[S.missionStep];startGame(m[0],m[1],true);return}
  if(a==='play'){const k=b.dataset.k;startGame(k,k==='cursa'?12:k==='kara'?1:k==='punts'||k==='talla'?3:6,false);return}
  if(a==='exit'){exitGame();return}
  if(handle2(a,b))return;
  if(a==='next'){nextItem();return}
  if(a==='say'){sayDict(G.items[G.i]);return}
  if(a==='saySlow'){say(G.items[G.i].w,true);return}
  if(a==='gotIt'){clearTimeout(G.st.pt);G.st.peek=false;renderGame();return}
  if(a==='sayS'){say(G.items[G.i].s);return}
  if(a==='peek'){G.st.peek=true;G.st.looks++;renderGame();peekTimer(4000);return}
  if(a==='tile'){const t=G.st.tiles.find(x=>x.id==b.dataset.id);const k=G.st.slots.indexOf(null);if(k<0||t.used)return;t.used=true;G.st.slots[k]=t;G.st.marks=null;renderGame();return}
  if(a==='unslot'){const i=+b.dataset.i,s=G.st.slots[i];if(!s)return;G.st.tiles.find(x=>x.id===s.id).used=false;G.st.slots[i]=null;G.st.marks=null;renderGame();return}
  if(a==='ecoCheck'){ecoCheck();return}
  if(a==='clue'){G.st.clue=true;renderGame();return}
  if(a==='detPick'){detPick(b.dataset.o);return}
  if(a==='ruleOk'){G.showRule=false;renderGame();return}
  if(a==='trucPick'){trucPick(b.dataset.o);return}
  if(a==='cut'){const p=+b.dataset.p;G.st.on.has(p)?G.st.on.delete(p):G.st.on.add(p);G.st.marks=null;renderGame();return}
  if(a==='tallaCheck'){tallaCheck();return}
  if(a==='buy'){const it=ACCS.find(x=>x.id===b.dataset.id);if(S.stars<it.price)return;S.stars-=it.price;S.owned.push(it.id);S.wearing.push(it.id);save();toast(`${it.name}: ja és teu!`);render();return}
  if(a==='wear'){const id=b.dataset.id;S.wearing=S.wearing.includes(id)?S.wearing.filter(x=>x!==id):S.wearing.concat(id);save();render();return}
  if(a==='pack'){if(S.stars<40)return;S.stars-=40;const c=giveCard();save();toast(c?`Photocard nova: ${c.name}!`:'Ja les tens totes!');view='cards';render();return}
  if(a==='delw'){S.llibreta=S.llibreta.filter(x=>x.w!==b.dataset.w);save();renderParents();return}
  if(a==='testVoice'){say('Hola! Som-hi, que avui toca brillar.');return}
  if(a==='reset'){G_reset=true;renderParents();return}
  if(a==='resetNo'){G_reset=false;renderParents();return}
  if(a==='resetYes'){const keepName=S.name;S=DEF();S.name=keepName;G_reset=false;save();toast('Progrés esborrat.');render();return}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act=exportState]');if(!b)return;
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lletres-estrella-'+TODAY()+'.json';a.click();});
document.addEventListener('change',e=>{if(e.target.id!=='importFile')return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||!Array.isArray(d.llibreta))throw 0;S=Object.assign(DEF(),d);save();toast('Còpia recuperada!');render()}catch(_){toast('Aquest fitxer no és una còpia de Lletres Estrella.')}})});
document.addEventListener('change',e=>{if(e.target.id==='petName'){const v=e.target.value.trim().slice(0,16);if(v){S.name=v;save();render()}}});

if(STANDALONE&&!S.updated&&!S.llibreta.length){const t=TODAY();[["notaven","Imperfet en -ava: sempre v."],["comunicaven","Imperfet en -ava: sempre v."],["valgut","Família: val."],["avis","Família: avi, àvia. Amb v."],["cosins","Sona com una u, però s'escriu o: cosí, cosina."],["localitzar","Família: lloc."],["emoció","Acaba en -ció, amb accent."],["feia","Verb en -ia: i, no ll."],["queien","Verb en -ia: i, no ll."],["companys","Amb ny, com company."],["però","Porta accent: però."],["família","Porta accent a la í."],["gent","Família: gentada. La t no sona però hi és."],["simpàtics","Davant de p, sempre m."],["conèixer","Accent obert: è."],["pagesos","Família: pagès."]].forEach(([w,p])=>S.llibreta.push({w,pista:p,cat:'textos',box:1,due:t,added:t}));}
